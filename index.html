    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme_v2");
          var dark = stored ? stored === "dark" : true;
          if (dark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
